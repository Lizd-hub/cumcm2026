[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cumcm2026-b"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8", "pymupdf>=1.24", "pypdf>=5"]
report = ["matplotlib>=3.8", "pymupdf>=1.24", "pillow>=10", "python-docx>=1.1"]
dev = ["pytest>=8", "matplotlib>=3.8", "pymupdf>=1.24", "pypdf>=5", "pillow>=10", "python-docx>=1.1"]

[project.scripts]
cumcm-b = "b_solution.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "official: opt-in smoke test against a user-started official simulator session",
]
